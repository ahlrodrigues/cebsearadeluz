version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ALLOW_LEGACY_QR=0
      - REQUIRE_REGISTRATION_APPROVAL=0
      - PROTECT_EXAM_ROUTES=1
      - SECRET_KEY=change-me
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:
