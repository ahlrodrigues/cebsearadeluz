server {
    listen 80;
    listen [::]:80;
    server_name app.example.com; # troque para seu domínio

    # Frontend build estático
    root /var/www/cebsearadeluz;
    index index.html;

    # Single Page App: sempre servir index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy para API FastAPI
    location ~ ^/(users|passes|auth|reports|exams|me|public|openapi\.json|docs) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Otimizações simples
    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
}

